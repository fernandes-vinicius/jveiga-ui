name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint test build typecheck

      - name: Install Playwright browsers
        run: pnpm --filter storybook exec playwright install --with-deps chromium

      - name: Storybook Test Runner (visual/interaction/a11y)
        run: pnpm --filter storybook exec concurrently -k -s first -n "SB,TEST" "pnpm --filter storybook exec http-server storybook-static --port 6006 --silent" "pnpm --filter storybook exec wait-on tcp:6006 && pnpm --filter storybook run test-storybook --url http://127.0.0.1:6006"
